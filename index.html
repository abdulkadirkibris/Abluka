<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Abluka Oyunu - Geliştirilmiş</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #2b2b2b;
    color: white;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  h1 {
    margin-top: 20px;
    font-size: 2em;
    color: #f0f0f0;
  }

  #status {
    margin: 15px;
    font-size: 18px;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(7, 70px);
    gap: 6px;
    justify-content: center;
    margin-bottom: 30px;
    perspective: 600px;
  }

  .cell {
    width: 70px;
    height: 70px;
    background: linear-gradient(145deg, #deb887, #c79a6b);
    border-radius: 8px;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.5), inset 1px 1px 3px rgba(255,255,255,0.2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
  }

  .cell:hover {
    transform: translateY(-2px);
    box-shadow: 4px 4px 12px rgba(0,0,0,0.6), inset 1px 1px 3px rgba(255,255,255,0.3);
  }

  .blocked {
    background: #d32f2f;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.6), inset 0px 0px 5px rgba(255,255,255,0.1);
  }
