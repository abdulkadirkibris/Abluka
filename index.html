<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Abluka - AI Edition</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #2b2b2b; color: white; text-align: center; margin: 0; padding: 10px;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }

  /* MENÜ TASARIMI */
  #mainMenu, #setupMenu {
    background: #3d3d3d; padding: 40px; border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6); max-width: 400px; width: 100%; margin-top: 50px;
  }

  .menu-logo { height: 80px; margin-bottom: 20px; }
  .menu-btn {
    display: block; width: 100%; padding: 15px; margin: 10px 0;
    border: none; border-radius: 10px; font-size: 18px; font-weight: bold;
    cursor: pointer; transition: 0.3s; color: white;
  }
  .btn-primary { background: #3498db; }
  .btn-secondary { background: #9b59b6; }
  .btn-start { background: #2ecc71; margin-top: 20px; }
  .menu-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }

  /* SEÇENEK GRUPLARI */
  .option-group { margin: 20px 0; text-align: left; }
  .option-group label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
  select {
    width: 100%; padding: 10px; border-radius: 5px; background: #2b2b2b;
    color: white; border: 1px solid #555; font-size: 16px;
  }

  /* OYUN ALANI (Varsayılan Gizli) */
  #gameArea { display: none; width: 100%; flex-direction: column; align-items: center; }

  .header-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 10px 0; }
  .game-logo { height: 40px; width: auto; }
  h1 { margin: 0; font-size: 32px; line-height: 40px; }

  .game-container { display: flex; flex-direction: row; justify-content: center; gap: 20px; flex-wrap: wrap; }
  .board-outer { background: #3d3d3d; padding: 10px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 480px; }
  .grid-container { display: grid; grid-template-columns: 25px repeat(7, 1fr); grid-template-rows: repeat(7, 1fr) 25px; width: 100%; }
  .row-label, .col-label { display: flex; align-items: center; justify-content: center; font-weight: bold; color: #aaa; font-size: 14px; }
  
  #board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; grid-column: 2 / 9; grid-row: 1 / 8; }
  .cell { aspect-ratio: 1 / 1; background: linear-gradient(145deg, #deb887, #c79a6b); border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .blocked { background: #d32f2f !important; border: none !important; }
  .piece { width: 80%; height: 80%; border-radius: 6px; box-shadow: 1px 2px 4px black; }
  .black { background: #000; }
  .white { background: #fff; border: 1px solid #ccc; }
  .glow { box-shadow: 0 0 12px 4px yellow; transform: scale(1.05); }

  .notation-panel { width: 250px; height: 450px; background: #1a1a1a; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; text-align: left; border: 1px solid #444; }
  #notationList { flex-grow: 1; overflow-y: auto; font-family: monospace; font-size: 13px; color: #aaa; list-style: none; padding: 0; margin-top: 10px; }
  .notation-item { padding: 6px 0; border-bottom: 1px solid #333; color: #eee; }

  .controls { margin-top: 20px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btn { border: none; padding: 12px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 14px; color: white; }
  .btn-undo { background: #3498db; }
  .btn-reset { background: #e67e22; }
  .btn-download { background: #2ecc71; }
  .btn-exit { background: #e74c3c; }

  @media (max-width: 600px) {
    .game-container { flex-direction: column; align-items: center; }
    .notation-panel { width: 100%; max-width: 480px; height: 160px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<div id="mainMenu">
  <img src="logo.png" alt="Abluka" class="menu-logo">
  <h2>ABLUKA</h2>
  <button class="menu-btn btn-primary" onclick="showSetup(false)">2 Kişilik Oyna</button>
  <button class="menu-btn btn-secondary" onclick="showSetup(true)">Yapay Zekaya Karşı</button>
</div>

<div id="setupMenu" style="display: none;">
  <h3>Oyun Ayarları</h3>
  <div class="option-group">
    <label>Rengini Seç:</label>
    <select id="playerColor">
      <option value="black">Siyah (Önce Başlar)</option>
      <option value="white">Beyaz</option>
    </select>
  </div>
  <div id="difficultySection" class="option-group">
    <label>AI Zorluk Seviyesi:</label>
    <select id="difficulty">
      <option value="easy">Kolay</option>
      <option value="medium">Orta</option>
      <option value="hard">Zor</option>
    </select>
  </div>
  <button class="menu-btn btn-start" onclick="startGame()">Savaşı Başlat!</button>
  <button class="menu-btn" style="background:#555" onclick="backToMain()">Geri</button>
</div>

<div id="gameArea">
  <div class="header-container">
    <img src="logo.png" alt="Abluka Logo" class="game-logo">
    <h1>Abluka Oyunu</h1>
  </div>
  <div id="status" style="margin-bottom: 10px; color: #ffd700; font-size: 1.1em; height: 25px;">Hazırlanıyor...</div>
  <div class="game-container">
    <div class="board-outer">
      <div class="grid-container">
        <div class="row-label">7</div><div id="board"></div>
        <div class="row-label">6</div><div class="row-label">5</div><div class="row-label">4</div><div class="row-label">3</div><div class="row-label">2</div><div class="row-label">1</div>
        <div></div><div class="col-label">A</div><div class="col-label">B</div><div class="col-label">C</div><div class="col-label">D</div><div class="col-label">E</div><div class="col-label">F</div><div class="col-label">G</div>
      </div>
    </div>
    <div class="notation-panel">
      <strong><small>HAMLE KAYDI</small></strong>
      <ul id="notationList"></ul>
    </div>
  </div>
  <div class="controls">
    <button class="btn btn-reset" onclick="startGame()">Sıfırla</button>
    <button id="undoBtn" class="btn btn-undo" onclick="undo()">Geri Al</button>
    <button class="btn btn-download" onclick="downloadNotation()">Notasyon</button>
    <button class="btn btn-exit" onclick="backToMain()">Çıkış</button>
  </div>
</div>

<script>
const size = 7;
const cols = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
let board = [], currentPlayer = "black", phase = "move", gameOver = false, history = [];
let players = { black: { x: 0, y: 3 }, white: { x: 6, y: 3 } };
let currentMoveNotation = "";

// AI Ayarları
let isVsAI = false;
let userColor = "black";
let aiDifficulty = "medium";

function showSetup(vsAI) {
  isVsAI = vsAI;
  document.getElementById("mainMenu").style.display = "none";
  document.getElementById("setupMenu").style.display = "block";
  document.getElementById("difficultySection").style.display = vsAI ? "block" : "none";
}

function backToMain() {
  document.getElementById("gameArea").style.display = "none";
  document.getElementById("setupMenu").style.display = "none";
  document.getElementById("mainMenu").style.display = "block";
}

function startGame() {
  userColor = document.getElementById("playerColor").value;
  aiDifficulty = document.getElementById("difficulty").value;
  
  document.getElementById("setupMenu").style.display = "none";
  document.getElementById("gameArea").style.display = "flex";
  
  initGame();
}

function initGame() {
  board = Array(size).fill().map(() => Array(size).fill("empty"));
  currentPlayer = "black"; phase = "move"; gameOver = false; history = [];
  players.black = { x: 0, y: 3 }; players.white = { x: 6, y: 3 };
  board[0][3] = "black"; board[6][3] = "white";
  document.getElementById("notationList").innerHTML = "";
  render();
  updateStatus();
  
  if(isVsAI && currentPlayer !== userColor) {
    setTimeout(runAI, 600);
  }
}

function render() {
  const boardDiv = document.getElementById("board");
  boardDiv.innerHTML = "";
  for (let i = 0; i < size; i++) {
    for (let j = 0; j < size; j++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const pCur = players[currentPlayer];
      const isNearby = Math.abs(pCur.x - i) <= 1 && Math.abs(pCur.y - j) <= 1;

      if (board[i][j] === "blocked") cell.classList.add("blocked");
      if (board[i][j] === "black" || board[i][j] === "white") {
        const p = document.createElement("div");
        p.className = `piece ${board[i][j]}`;
        if (!gameOver && board[i][j] === currentPlayer) p.classList.add("glow");
        cell.appendChild(p);
      } else if (!gameOver && phase === "move" && isNearby && board[i][j] === "empty") {
        // AI sırasındayken parlamayı gösterme
        if(!isVsAI || currentPlayer === userColor) {
          cell.style.boxShadow = "inset 0 0 12px rgba(255,215,0,0.9)";
          cell.style.border = "1px solid gold";
        }
      }
      cell.onclick = () => {
        if(isVsAI && currentPlayer !== userColor) return;
        handleClick(i, j);
      };
      boardDiv.appendChild(cell);
    }
  }
}

function handleClick(x, y) {
  if (gameOver) return;
  if (phase === "move") movePiece(x, y);
  else blockCell(x, y);
}

function movePiece(x, y) {
  const p = players[currentPlayer];
  if (board[x][y] !== "empty") return;
  if (Math.abs(p.x - x) <= 1 && Math.abs(p.y - y) <= 1) {
    saveState();
    const from = getCoord(p.x, p.y), to = getCoord(x, y);
    board[p.x][p.y] = "empty"; board[x][y] = currentPlayer;
    players[currentPlayer] = { x, y };
    currentMoveNotation = `${currentPlayer === 'black' ? 'Siyah' : 'Beyaz'}: ${from}→${to}`;
    updateNotationUI(currentMoveNotation, true);
    phase = "block"; render(); updateStatus();
    
    if(isVsAI && currentPlayer !== userColor) {
      setTimeout(runAI, 600);
    }
  }
}

function blockCell(x, y) {
  if (board[x][y] !== "empty") return;
  saveState();
  board[x][y] = "blocked";
  currentMoveNotation += ` | #${getCoord(x, y)}`;
  updateNotationUI(currentMoveNotation, false);
  render();
  if (checkWin()) { gameOver = true; return; }
  phase = "move"; currentPlayer = (currentPlayer === "black") ? "white" : "black";
  render(); updateStatus();
  
  if(isVsAI && currentPlayer !== userColor && !gameOver) {
    setTimeout(runAI, 600);
  }
}

// YAPAY ZEKA MANTIĞI
function runAI() {
  if (gameOver) return;
  
  const p = players[currentPlayer];
  const opponent = currentPlayer === "black" ? "white" : "black";
  const opPos = players[opponent];

  if (phase === "move") {
    let moves = getValidMoves(p.x, p.y);
    let bestMove;

    if (aiDifficulty === "easy") {
      bestMove = moves[Math.floor(Math.random() * moves.length)];
    } else {
      // Orta ve Zor: Rakibe en çok yaklaşan veya en çok alanı olanı seç
      moves.sort((a, b) => {
        const distA = Math.abs(a.x - opPos.x) + Math.abs(a.y - opPos.y);
        const distB = Math.abs(b.x - opPos.x) + Math.abs(b.y - opPos.y);
        return distA - distB;
      });
      bestMove = (aiDifficulty === "hard") ? moves[0] : moves[Math.floor(Math.random() * Math.min(3, moves.length))];
    }
    movePiece(bestMove.x, bestMove.y);
  } else {
    let blocks = [];
    for(let i=0; i<size; i++) {
      for(let j=0; j<size; j++) {
        if(board[i][j] === "empty") blocks.push({x:i, y:j});
      }
    }

    let bestBlock;
    if (aiDifficulty === "easy") {
      bestBlock = blocks[Math.floor(Math.random() * blocks.length)];
    } else {
      // Rakibin etrafındaki boşlukları bul ve orayı kapa
      let opMoves = getValidMoves(opPos.x, opPos.y);
      if(opMoves.length > 0 && aiDifficulty !== "easy") {
        bestBlock = opMoves[0]; // Rakibi sıkıştır
      } else {
        bestBlock = blocks[Math.floor(Math.random() * blocks.length)];
      }
    }
    blockCell(bestBlock.x, bestBlock.y);
  }
}

function getValidMoves(x, y) {
  let valid = [];
  for(let dx=-1; dx<=1; dx++){
    for(let dy=-1; dy<=1; dy++){
      if(dx===0 && dy===0) continue;
      let nx = x+dx, ny = y+dy;
      if(nx>=0 && nx<size && ny>=0 && ny<size && board[nx][ny] === "empty") {
        valid.push({x:nx, y:ny});
      }
    }
  }
  return valid;
}

// YARDIMCI FONKSİYONLAR (Önceki kodlarla aynı)
function getCoord(x, y) { return cols[y] + (size - x); }
function updateNotationUI(text, isNewMove) {
  const list = document.getElementById("notationList");
  if (isNewMove) {
    const li = document.createElement("li"); li.className = "notation-item";
    li.innerText = text; list.prepend(li);
  } else if (list.firstChild) list.firstChild.innerText = text;
}
function saveState() { history.push(JSON.parse(JSON.stringify({ board, currentPlayer, phase, players, gameOver, currentMoveNotation }))); }
function undo() {
  if (history.length < (isVsAI ? 2 : 1) || gameOver) return;
  // AI modunda 2 hamle geri gitmeli (AI + Sen)
  const steps = isVsAI ? 2 : 1;
  for(let i=0; i<steps; i++) {
    const prevState = history.pop();
    const list = document.getElementById("notationList");
    if (list.firstChild) list.removeChild(list.firstChild);
    board = prevState.board; currentPlayer = prevState.currentPlayer;
    phase = prevState.phase; players = prevState.players; gameOver = prevState.gameOver;
    currentMoveNotation = prevState.currentMoveNotation;
  }
  render(); updateStatus();
}
function checkWin() {
  const opponent = (currentPlayer === "black") ? "white" : "black";
  const p = players[opponent];
  const moves = getValidMoves(p.x, p.y);
  if(moves.length === 0) {
    document.getElementById("status").innerText = "KAZANAN: " + (currentPlayer === "black" ? "Siyah" : "Beyaz");
    document.getElementById("status").style.color = "#2ecc71";
    return true;
  }
  return false;
}
function updateStatus() {
  const turn = (currentPlayer === "black" ? "Siyah" : "Beyaz");
  const action = (phase === "move" ? "Taşını Oynat" : "Blok Koy!");
  document.getElementById("status").innerText = isVsAI && currentPlayer !== userColor ? "Yapay Zeka Düşünüyor..." : `${turn} - ${action}`;
}
function downloadNotation() {
  const listItems = document.querySelectorAll(".notation-item");
  let textContent = "--- ABLUKA OYUNU ---\n\n";
  Array.from(listItems).reverse().forEach((item, index) => { textContent += `${index + 1}. ${item.innerText}\n`; });
  const blob = new Blob([textContent], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "notasyon.txt"; a.click();
}
</script>
</body>
</html>
