<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Abluka - AI & Büyük Tahta Edition</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #2b2b2b; color: white; text-align: center; margin: 0; padding: 10px;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }

  /* --- MENÜ TASARIMLARI --- */
  #mainMenu, #setupMenu {
    background: #3d3d3d; padding: 30px; border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6); width: 95%; max-width: 400px; margin-top: 30px;
  }
  .menu-logo { height: 80px; margin-bottom: 15px; object-fit: contain; }
  .menu-btn {
    display: block; width: 100%; padding: 18px; margin: 12px 0;
    border: none; border-radius: 10px; font-size: 18px; font-weight: bold;
    cursor: pointer; transition: 0.3s; color: white;
  }
  .btn-primary { background: #3498db; }
  .btn-secondary { background: #9b59b6; }
  .btn-start { background: #2ecc71; margin-top: 20px; }
  .menu-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

  /* --- OYUN ALANI --- */
  #gameArea { display: none; width: 100%; flex-direction: column; align-items: center; }
  .header-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 5px 0 15px 0; }
  .game-logo { height: 40px; width: auto; object-fit: contain; }
  h1 { margin: 0; font-size: 32px; line-height: 40px; }

  .game-container {
    display: flex; flex-direction: row; justify-content: center;
    align-items: flex-start; gap: 20px; flex-wrap: wrap; width: 100%;
  }

  /* TAHTA BOYUTU - MOBİLDE MAKSİMUM GENİŞLİK */
  .board-outer {
    background: #3d3d3d; padding: 8px; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 500px;
  }
  .grid-container {
    display: grid; grid-template-columns: 25px repeat(7, 1fr);
    grid-template-rows: repeat(7, 1fr) 25px; width: 100%;
  }
  .row-label, .col-label { display: flex; align-items: center; justify-content: center; font-weight: bold; color: #aaa; font-size: 14px; }
  
  #board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; grid-column: 2 / 9; grid-row: 1 / 8; }
  .cell { aspect-ratio: 1 / 1; background: linear-gradient(145deg, #deb887, #c79a6b); border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .blocked { background: #d32f2f !important; border: none !important; }
  .piece { width: 80%; height: 80%; border-radius: 6px; box-shadow: 1px 2px 4px black; }
  .black { background: #000; }
  .white { background: #fff; border: 1px solid #ccc; }
  .glow { box-shadow: 0 0 12px 4px yellow; transform: scale(1.05); }

  /* NOTASYON PANELİ */
  .notation-panel {
    width: 280px; height: 480px; background: #1a1a1a; border-radius: 10px;
    padding: 15px; display: flex; flex-direction: column; text-align: left; border: 1px solid #444;
  }
  #notationList { flex-grow: 1; overflow-y: auto; font-family: monospace; font-size: 13px; color: #aaa; list-style: none; padding: 0; margin-top: 10px; }
  .notation-item { padding: 6px 0; border-bottom: 1px solid #333; color: #eee; }

  /* KONTROLLER */
  .controls { margin-top: 20px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; width: 100%; max-width: 500px; }
  .btn { border: none; padding: 14px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; color: white; flex: 1; }
  .btn-undo { background: #3498db; }
  .btn-reset { background: #e67e22; }
  .btn-download { background: #2ecc71; }
  .btn-exit { background: #e74c3c; }

  /* MOBİL ÖZEL AYARLAR */
  @media (max-width: 600px) {
    h1 { font-size: 24px; line-height: 30px; }
    .board-outer { max-width: 98vw; padding: 5px; }
    .grid-container { grid-template-columns: 20px repeat(7, 1fr); grid-template-rows: repeat(7, 1fr) 20px; }
    .row-label, .col-label { font-size: 11px; }
    .notation-panel { width: 98vw; height: 130px; margin-top: 10px; }
    .btn { padding: 12px 8px; font-size: 12px; }
  }
</style>
</head>
<body>

<div id="mainMenu">
  <img src="logo.png" alt="Abluka" class="menu-logo">
  <h2 style="margin:0 0 20px 0; letter-spacing: 2px;">ABLUKA</h2>
  <button class="menu-btn btn-primary" onclick="showSetup(false)">2 Kişilik Oyna</button>
  <button class="menu-btn btn-secondary" onclick="showSetup(true)">Yapay Zekaya Karşı</button>
</div>

<div id="setupMenu" style="display: none;">
  <h3>Oyun Ayarları</h3>
  <div style="text-align:left; margin:15px 0;">
    <label style="color:#aaa; font-size:14px;">Taşın:</label>
    <select id="playerColor" style="width:100%; padding:12px; margin-top:5px; background:#2b2b2b; color:white; border:1px solid #555; font-size:16px;">
      <option value="black">Siyah (Önce Başlar)</option>
      <option value="white">Beyaz</option>
    </select>
  </div>
  <div id="difficultySection" style="text-align:left; margin:15px 0;">
    <label style="color:#aaa; font-size:14px;">AI Zorluğu:</label>
    <select id="difficulty" style="width:100%; padding:12px; margin-top:5px; background:#2b2b2b; color:white; border:1px solid #555; font-size:16px;">
      <option value="easy">Kolay</option>
      <option value="medium" selected>Orta</option>
      <option value="hard">Zor</option>
    </select>
  </div>
  <button class="menu-btn btn-start" onclick="startGame()">Başlat</button>
  <button class="menu-btn" style="background:#555" onclick="backToMain()">Geri</button>
</div>

<div id="gameArea">
  <div class="header-container">
    <img src="logo.png" alt="Abluka Logo" class="game-logo">
    <h1>Abluka Oyunu</h1>
  </div>
  <div id="status" style="margin-bottom: 8px; font-weight: bold; height: 24px;"></div>
  <div class="game-container">
    <div class="board-outer">
      <div class="grid-container">
        <div class="row-label">7</div><div id="board"></div>
        <div class="row-label">6</div><div class="row-label">5</div><div class="row-label">4</div><div class="row-label">3</div><div class="row-label">2</div><div class="row-label">1</div>
        <div></div><div class="col-label">A</div><div class="col-label">B</div><div class="col-label">C</div><div class="col-label">D</div><div class="col-label">E</div><div class="col-label">F</div><div class="col-label">G</div>
      </div>
    </div>
    <div class="notation-panel">
      <strong><small>HAMLE KAYDI</small></strong>
      <ul id="notationList"></ul>
    </div>
  </div>
  <div class="controls">
    <button class="btn btn-undo" onclick="undo()">Geri Al</button>
    <button class="btn btn-reset" onclick="initGame()">Sıfırla</button>
    <button class="btn btn-download" onclick="downloadNotation()">Notasyon</button>
    <button class="btn btn-exit" onclick="backToMain()">Çıkış</button>
  </div>
</div>

<script>
// --- OYUN DEĞİŞKENLERİ ---
const size = 7;
const cols = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
let board = [], currentPlayer = "black", phase = "move", gameOver = false, history = [];
let players = { black: { x: 0, y: 3 }, white: { x: 6, y: 3 } };
let currentMoveNotation = "", isVsAI = false, userColor = "black", aiDifficulty = "medium", aiTimeout = null;

// --- MENÜ KONTROLLERİ ---
function showSetup(vsAI) {
  isVsAI = vsAI;
  document.getElementById("mainMenu").style.display = "none";
  document.getElementById("setupMenu").style.display = "block";
  document.getElementById("difficultySection").style.display = vsAI ? "block" : "none";
}

function backToMain() {
  clearTimeout(aiTimeout);
  document.getElementById("gameArea").style.display = "none";
  document.getElementById("setupMenu").style.display = "none";
  document.getElementById("mainMenu").style.display = "block";
}

function startGame() {
  userColor = document.getElementById("playerColor").value;
  aiDifficulty = document.getElementById("difficulty").value;
  document.getElementById("setupMenu").style.display = "none";
  document.getElementById("gameArea").style.display = "flex";
  initGame();
}

// --- OYUN MANTIĞI ---
function initGame() {
  clearTimeout(aiTimeout);
  board = Array(size).fill().map(() => Array(size).fill("empty"));
  currentPlayer = "black"; phase = "move"; gameOver = false; history = [];
  players.black = { x: 0, y: 3 }; players.white = { x: 6, y: 3 };
  board[0][3] = "black"; board[6][3] = "white";
  document.getElementById("notationList").innerHTML = "";
  render(); updateStatus();
  if(isVsAI && currentPlayer !== userColor) aiTimeout = setTimeout(runAI, 800);
}

function render() {
  const boardDiv = document.getElementById("board");
  boardDiv.innerHTML = "";
  for (let i = 0; i < size; i++) {
    for (let j = 0; j < size; j++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      if (board[i][j] === "blocked") cell.classList.add("blocked");
      if (board[i][j] === "black" || board[i][j] === "white") {
        const p = document.createElement("div");
        p.className = `piece ${board[i][j]}`;
        if (!gameOver && board[i][j] === currentPlayer) p.classList.add("glow");
        cell.appendChild(p);
      } else if (!gameOver && phase === "move" && (currentPlayer === userColor || !isVsAI)) {
        const pCur = players[currentPlayer];
        if (Math.abs(pCur.x - i) <= 1 && Math.abs(pCur.y - j) <= 1 && board[i][j] === "empty") {
          cell.style.boxShadow = "inset 0 0 12px gold";
        }
      }
      cell.onclick = () => { if(!(isVsAI && currentPlayer !== userColor)) handleClick(i, j); };
      boardDiv.appendChild(cell);
    }
  }
}

function handleClick(x, y) {
  if (gameOver) return;
  if (phase === "move") movePiece(x, y);
  else blockCell(x, y);
}

function movePiece(x, y) {
  const p = players[currentPlayer];
  if (board[x][y] !== "empty" || Math.abs(p.x - x) > 1 || Math.abs(p.y - y) > 1) return;
  saveState();
  board[p.x][p.y] = "empty"; board[x][y] = currentPlayer;
  currentMoveNotation = `${currentPlayer === 'black' ? 'Siyah' : 'Beyaz'}: ${getCoord(p.x, p.y)}→${getCoord(x, y)}`;
  players[currentPlayer] = { x, y };
  updateNotationUI(currentMoveNotation, true);
  phase = "block"; render(); updateStatus();
  if(isVsAI && currentPlayer !== userColor) aiTimeout = setTimeout(runAI, 800);
}

function blockCell(x, y) {
  if (board[x][y] !== "empty") return;
  saveState();
  board[x][y] = "blocked";
  currentMoveNotation += ` | #${getCoord(x, y)}`;
  updateNotationUI(currentMoveNotation, false);
  render();
  if (checkWin()) { gameOver = true; return; }
  phase = "move"; currentPlayer = (currentPlayer === "black") ? "white" : "black";
  render(); updateStatus();
  if(isVsAI && currentPlayer !== userColor && !gameOver) aiTimeout = setTimeout(runAI, 800);
}

// --- YAPAY ZEKA ---
function runAI() {
  if (gameOver) return;
  const p = players[currentPlayer], op = players[userColor];
  if (phase === "move") {
    let moves = getValidMoves(p.x, p.y);
    moves.sort((a, b) => {
      let d1 = Math.abs(a.x - op.x) + Math.abs(a.y - op.y);
      let d2 = Math.abs(b.x - op.x) + Math.abs(b.y - op.y);
      return aiDifficulty === "hard" ? d1 - d2 : (Math.random() > 0.4 ? d1 - d2 : 0);
    });
    movePiece(moves[0].x, moves[0].y);
  } else {
    let opMoves = getValidMoves(op.x, op.y);
    if(opMoves.length > 0 && aiDifficulty !== "easy") blockCell(opMoves[0].x, opMoves[0].y);
    else {
      let em = [];
      for(let i=0; i<size; i++) for(let j=0; j<size; j++) if(board[i][j]==="empty") em.push({x:i, y:j});
      let b = em[Math.floor(Math.random()*em.length)];
      blockCell(b.x, b.y);
    }
  }
}

function getValidMoves(x, y) {
  let v = [];
  for(let dx=-1; dx<=1; dx++) for(let dy=-1; dy<=1; dy++) {
    let nx=x+dx, ny=y+dy;
    if(nx>=0 && nx<size && ny>=0 && ny<size && board[nx][ny]==="empty" && !(dx===0 && dy===0)) v.push({x:nx, y:ny});
  }
  return v;
}

// --- GERİ AL (UNDO) ---
function undo() {
  const steps = isVsAI ? 2 : 1;
  if (history.length < steps || gameOver) return;
  
  clearTimeout(aiTimeout); // AI'nın planlı hamlesini iptal et
  
  for(let i = 0; i < steps; i++) {
    const s = history.pop();
    const list = document.getElementById("notationList");
    if (list && list.firstChild) list.removeChild(list.firstChild);
    
    // Verileri geçmişe döndür
    board = s.board;
    currentPlayer = s.currentPlayer;
    phase = s.phase;
    players = JSON.parse(JSON.stringify(s.players));
    gameOver = s.gameOver;
    currentMoveNotation = s.currentMoveNotation;
  }

  // AI modunda geri alındığında sıra her zaman oyuncuya (userColor) ve hareket fazına (move) geçer
  if(isVsAI) {
    currentPlayer = userColor;
    phase = "move";
  }

  render();
  updateStatus();
}

// --- YARDIMCI FONKSİYONLAR ---
function checkWin() {
  const op = (currentPlayer === "black") ? "white" : "black";
  if(getValidMoves(players[op].x, players[op].y).length === 0) {
    const st = document.getElementById("status");
    st.innerText = "KAZANAN: " + (currentPlayer === "black" ? "Siyah" : "Beyaz");
    st.style.color = "#2ecc71";
    return true;
  }
  return false;
}

function updateStatus() {
  const st = document.getElementById("status");
  if (isVsAI && currentPlayer !== userColor && !gameOver) {
    st.innerText = "Yapay Zeka Düşünüyor..."; st.style.color = "#aaa";
  } else {
    st.innerText = `${currentPlayer === "black" ? "Siyah" : "Beyaz"} - ${phase === "move" ? "Taşını Oynat" : "Blok Koy!"}`;
    st.style.color = "#ffd700";
  }
}

function saveState() { history.push(JSON.parse(JSON.stringify({ board, currentPlayer, phase, players, gameOver, currentMoveNotation }))); }
function getCoord(x, y) { return cols[y] + (size - x); }
function updateNotationUI(t, isNew) {
  const l = document.getElementById("notationList");
  if (isNew) { const li = document.createElement("li"); li.className="notation-item"; li.innerText=t; l.prepend(li); }
  else if (l.firstChild) l.firstChild.innerText = t;
}
function downloadNotation() {
  let txt = "--- ABLUKA OYUNU HAMLE KAYDI ---\n\n";
  Array.from(document.querySelectorAll(".notation-item")).reverse().forEach((it, idx) => { txt += `${idx + 1}. ${it.innerText}\n`; });
  const b = new Blob([txt], { type: "text/plain" });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a"); a.href = u; a.download = "notasyon.txt"; a.click();
}
</script>
</body>
</html>
