<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeka Oyunları Platformu</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #2b2b2b; color: white; margin: 0; padding: 0;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }

  .main-header {
    background: #1a1a1a; width: 100%; padding: 30px 10px;
    text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    margin-bottom: 40px;
  }

  .main-header h1 { margin: 0; font-size: 36px; color: #ffd700; letter-spacing: 2px; }
  .main-header p { margin: 10px 0 0; color: #aaa; font-size: 18px; }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px; width: 90%; max-width: 1000px; padding: 20px;
  }

  .game-card {
    background: #3d3d3d; border-radius: 15px; overflow: hidden;
    transition: transform 0.3s, box-shadow 0.3s; cursor: pointer;
    border: 1px solid #444; position: relative;
    text-decoration: none; color: white;
  }

  .game-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    border-color: #ffd700;
  }
.game-img img {
    width: 48px;  /* İstediğiniz genişlik */
    height: 48px; /* İstediğiniz yükseklik */
    object-fit: contain; /* Resmin div içine sığmasını sağlar */
}
  .game-img {
    width: 100%; height: 180px; background: #222;
    display: flex; align-items: center; justify-content: center;
    font-size: 50px; border-bottom: 2px solid #444;
  }

  .game-info { padding: 20px; text-align: center; }
  .game-info h2 { margin: 0 0 10px; font-size: 24px; color: #eee; }
  .game-info p { margin: 0; color: #bbb; font-size: 14px; line-height: 1.5; }

  .badge {
    position: absolute; top: 10px; right: 10px;
    background: #e67e22; padding: 5px 10px; border-radius: 5px;
    font-size: 12px; font-weight: bold;
  }

  footer { margin-top: auto; padding: 20px; color: #666; font-size: 12px; }
</style>
</head>
<body>

<header class="main-header">
  <h1>ZEKA OYUNLARI</h1>
  <p>Zekanı test et, stratejini belirle.</p>
</header>

<div class="games-grid">
  <a href="abluka.html" class="game-card">
    <div class="game-img">
     <img src="logo.png" alt="Oyun Simgesi">
    </div>
    <div class="game-info">
      <h2>Abluka Oyunu</h2>
     
    </div>
  </a>

  <a href="kure.html" class="game-card">
    <div class="game-img">🔮</div>
    
    <div class="game-info">
      <h2>Küre Oyunu</h2>
      
    </div>
  </a>

  <div class="game-card" style="opacity: 0.6; cursor: default;">
    <div class="game-img">❓</div>
    <div class="game-info">
      <h2>Yeni Oyun</h2>
      <p>Çok yakında yeni zeka oyunları burada yerini alacak.</p>
    </div>
  </div>
</div>

<footer>&copy; 2026 Zeka Oyunları Platformu</footer>

</body>
</html>
