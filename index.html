<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abluka Oyunu - Notasyonlu</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #2b2b2b; color: white; text-align: center; margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
  }

  .game-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }

  #board {
    display: grid; grid-template-columns: repeat(7, 60px); gap: 6px;
    background: #444; padding: 10px; border-radius: 10px;
  }

  .notation-panel {
    width: 200px; height: 460px; background: #1a1a1a; border-radius: 10px;
    padding: 10px; display: flex; flex-direction: column; text-align: left;
  }

  #notationList {
    flex-grow: 1; overflow-y: auto; font-family: monospace; font-size: 14px;
    color: #ccc; list-style: none; padding: 0; margin-top: 10px; border-top: 1px solid #333;
  }

  .notation-item { padding: 4px 0; border-bottom: 1px solid #222; }

  .cell {
    width: 60px; height: 60px; background: linear-gradient(145deg, #deb887, #c79a6b);
    border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    position: relative; transition: 0.2s;
  }

  /* Koordinat Etiketleri */
  .cell::before {
    content: attr(data-coord); position: absolute; bottom: 2px; right: 2px;
    font-size: 9px; color: rgba(0,0,0,0.3); font-weight: bold;
  }

  .blocked { background: #d32f2f !important; }
  .piece { width: 45px; height: 45px; border-radius: 8px; box-shadow: 1px 1px 5px black; }
  .black { background: #000; }
  .white { background: #fff; border: 1px solid #ccc; }
  .glow { box-shadow: 0 0 15px 5px yellow; transform: scale(1.05); }

  .controls { margin-top: 20px; display: flex; gap: 10px; }
  .btn { border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
  .btn-undo { background: #3498db; color: white; }
  .btn-reset { background: #e67e22; color: white; }
  
  @media (max-width: 600px) {
    .game-container { flex-direction: column; align-items: center; }
    .notation-panel { width: 90%; height: 150px; }
  }
</style>
</head>
<body>

<h1>Abluka Oyunu</h1>
<div id="status" style="margin-bottom: 15px; color: #ffd700; font-weight: bold;">Siyah - Taşını Oynat</div>

<div class="game-container">
  <div id="board"></div>
  
  <div class="notation-panel">
    <strong>Hamle Kaydı</strong>
    <ul id="notationList"></ul>
  </div>
</div>

<div class="controls">
  <button class="btn btn-reset" onclick="init()">Yeniden Başlat</button>
  <button id="undoBtn" class="btn btn-undo" onclick="undo()">Geri Al</button>
</div>

<script>
const size = 7;
const cols = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
let board = [], currentPlayer = "black", phase = "move", gameOver = false, history = [];

let players = { black: { x: 0, y: 3 }, white: { x: 6, y: 3 } };

function getCoord(x, y) {
  // x satır, y sütun. Satrançta aşağıdan yukarı sayıldığı için 7-x yapıyoruz.
  return cols[y] + (size - x);
}

function addNotation(text) {
  const list = document.getElementById("notationList");
  const li = document.createElement("li");
  li.className = "notation-item";
  const turn = Math.floor(history.length / 2) + 1;
  li.innerText = `${text}`;
  list.prepend(li); // En son hamleyi en üstte göster
}

function init() {
  board = Array(size).fill().map(() => Array(size).fill("empty"));
  currentPlayer = "black"; phase = "move"; gameOver = false; history = [];
  players.black = { x: 0, y: 3 }; players.white = { x: 6, y: 3 };
  board[0][3] = "black"; board[6][3] = "white";
  document.getElementById("notationList").innerHTML = "";
  render();
  updateStatus();
}

function render() {
  const boardDiv = document.getElementById("board");
  boardDiv.innerHTML = "";
  for (let i = 0; i < size; i++) {
    for (let j = 0; j < size; j++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.setAttribute("data-coord", getCoord(i, j));
      
      const pCurrent = players[currentPlayer];
      const isNearby = Math.abs(pCurrent.x - i) <= 1 && Math.abs(pCurrent.y - j) <= 1;

      if (board[i][j] === "blocked") cell.classList.add("blocked");
      if (board[i][j] === "black" || board[i][j] === "white") {
        const p = document.createElement("div");
        p.className = `piece ${board[i][j]}`;
        if (!gameOver && board[i][j] === currentPlayer) p.classList.add("glow");
        cell.appendChild(p);
      } else if (!gameOver && phase === "move" && isNearby) {
        cell.style.boxShadow = "inset 0 0 10px gold";
      }
      cell.onclick = () => handleClick(i, j);
      boardDiv.appendChild(cell);
    }
  }
}

function handleClick(x, y) {
  if (gameOver) return;
  if (phase === "move") movePiece(x, y);
  else blockCell(x, y);
}

function movePiece(x, y) {
  const p = players[currentPlayer];
  if (board[x][y] !== "empty") return;
  if (Math.abs(p.x - x) <= 1 && Math.abs(p.y - y) <= 1) {
    const fromCoord = getCoord(p.x, p.y);
    const toCoord = getCoord(x, y);
    
    saveState();
    board[p.x][p.y] = "empty";
    board[x][y] = currentPlayer;
    players[currentPlayer] = { x, y };
    
    addNotation(`${currentPlayer === 'black' ? 'S' : 'B'}: ${fromCoord}→${toCoord}`);
    
    phase = "block";
    render();
    updateStatus();
  }
}

function blockCell(x, y) {
  if (board[x][y] !== "empty") return;
  saveState();
  board[x][y] = "blocked";
  addNotation(`${currentPlayer === 'black' ? 'S' : 'B'}: #${getCoord(x, y)}`);
  
  render();
  if (checkWin()) { gameOver = true; render(); return; }
  
  phase = "move";
  currentPlayer = (currentPlayer === "black") ? "white" : "black";
  render();
  updateStatus();
}

function saveState() {
  history.push(JSON.parse(JSON.stringify({ board, currentPlayer, phase, players, gameOver })));
}

function undo() {
  if (history.length === 0 || gameOver) return;
  const prevState = history.pop();
  board = prevState.board; currentPlayer = prevState.currentPlayer;
  phase = prevState.phase; players = prevState.players; gameOver = prevState.gameOver;
  document.getElementById("notationList").removeChild(document.getElementById("notationList").firstChild);
  render();
  updateStatus();
}

function checkWin() {
  const opponent = (currentPlayer === "black") ? "white" : "black";
  const p = players[opponent];
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      if (dx === 0 && dy === 0) continue;
      let nx = p.x + dx, ny = p.y + dy;
      if (nx >= 0 && ny >= 0 && nx < size && ny < size && board[nx][ny] === "empty") return false;
    }
  }
  document.getElementById("status").innerText = "KAZANAN: " + (currentPlayer === "black" ? "Siyah" : "Beyaz");
  return true;
}

function updateStatus() {
  const turn = (currentPlayer === "black" ? "Siyah" : "Beyaz");
  const action = (phase === "move" ? "Taşını Oynat" : "Blok Koy!");
  document.getElementById("status").innerText = `${turn} - ${action}`;
}

init();
</script>
</body>
</html>
