<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Abluka Pro - Ultra AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a1a; color: white; text-align: center; margin: 0; padding: 10px;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }

  /* --- MENÜ TASARIMLARI --- */
  #mainMenu, #setupMenu {
    background: #2d2d2d; padding: 30px; border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.8); width: 95%; max-width: 400px; margin-top: 30px;
    border: 1px solid #444;
  }
  .menu-logo { height: 80px; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(52, 152, 219, 0.5)); }
  .menu-btn {
    display: block; width: 100%; padding: 18px; margin: 12px 0;
    border: none; border-radius: 10px; font-size: 18px; font-weight: bold;
    cursor: pointer; transition: 0.3s; color: white;
  }
  .btn-primary { background: #2980b9; }
  .btn-secondary { background: #8e44ad; }
  .btn-start { background: #27ae60; margin-top: 20px; }
  .menu-btn:hover { transform: scale(1.02); filter: brightness(1.2); }

  /* --- OYUN ALANI --- */
  #gameArea { display: none; width: 100%; flex-direction: column; align-items: center; }
  .header-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 5px 0 10px 0; }
  .game-logo { height: 35px; width: auto; }
  h1 { margin: 0; font-size: 28px; color: #3498db; }

  .game-container {
    display: flex; flex-direction: row; justify-content: center;
    align-items: flex-start; gap: 15px; flex-wrap: wrap; width: 100%;
  }

  .board-outer {
    background: #333; padding: 10px; border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 480px;
    border: 2px solid #444;
  }
  .grid-container {
    display: grid; grid-template-columns: 25px repeat(7, 1fr);
    grid-template-rows: repeat(7, 1fr) 25px; width: 100%;
  }
  .row-label, .col-label { display: flex; align-items: center; justify-content: center; font-weight: bold; color: #888; font-size: 13px; }
  
  #board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; grid-column: 2 / 9; grid-row: 1 / 8; }
  .cell { aspect-ratio: 1 / 1; background: #555; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; position: relative; }
  .blocked { background: #c0392b !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
  .piece { width: 85%; height: 85%; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.6); }
  .black { background: radial-gradient(circle at 30% 30%, #444, #000); }
  .white { background: radial-gradient(circle at 30% 30%, #fff, #bbb); border: 1px solid #999; }
  .glow { box-shadow: 0 0 15px 5px rgba(52, 152, 219, 0.8); animation: pulse 1.5s infinite; }

  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  .notation-panel {
    width: 280px; height: 430px; background: #000; border-radius: 12px;
    padding: 15px; display: flex; flex-direction: column; text-align: left; border: 1px solid #333;
  }
  #notationList { flex-grow: 1; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px; color: #2ecc71; list-style: none; padding: 0; }
  .notation-item { padding: 4px 0; border-bottom: 1px solid #222; }

  .controls { margin-top: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; width: 100%; max-width: 480px; }
  .btn { border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; flex: 1; min-width: 80px; transition: 0.2s; }
  .btn-undo { background: #2980b9; }
  .btn-reset { background: #f39c12; }
  .btn-download { background: #27ae60; }
  .btn-exit { background: #c0392b; }

  @media (max-width: 600px) {
    .board-outer { max-width: 98vw; }
    .notation-panel { width: 98vw; height: 120px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<div id="mainMenu">
  <img src="logo.png" alt="Abluka" class="menu-logo">
  <h2 style="margin:0 0 20px 0; letter-spacing: 3px; color:#3498db;">ABLUKA PRO</h2>
  <button class="menu-btn btn-primary" onclick="showSetup(false)">2 KİŞİLİK</button>
  <button class="menu-btn btn-secondary" onclick="showSetup(true)">YAPAY ZEKA (USTA)</button>
</div>

<div id="setupMenu" style="display: none;">
  <h3>Savaş Hazırlığı</h3>
  <div style="text-align:left; margin:15px 0;">
    <label>Rengini Seç:</label>
    <select id="playerColor" style="width:100%; padding:12px; background:#1a1a1a; color:white; border:1px solid #444; border-radius:8px;">
      <option value="black">Siyah (Önce Başlar)</option>
      <option value="white">Beyaz</option>
    </select>
  </div>
  <div id="difficultySection" style="text-align:left; margin:15px 0;">
    <label>AI Zekası:</label>
    <select id="difficulty" style="width:100%; padding:12px; background:#1a1a1a; color:white; border:1px solid #444; border-radius:8px;">
      <option value="easy">Çaylak (Rastgele)</option>
      <option value="medium">Asker (Mantıklı)</option>
      <option value="hard" selected>General (Stratejik - Zor)</option>
    </select>
  </div>
  <button class="menu-btn btn-start" onclick="startGame()">SAVAŞI BAŞLAT</button>
  <button class="menu-btn" style="background:#444" onclick="backToMain()">GERİ</button>
</div>

<div id="gameArea">
  <div class="header-container">
    <img src="logo.png" alt="Logo" class="game-logo">
    <h1>ABLUKA</h1>
  </div>
  <div id="status" style="margin-bottom: 10px; font-weight: bold; color: #f1c40f;"></div>
  <div class="game-container">
    <div class="board-outer">
      <div class="grid-container">
        <div class="row-label">7</div><div id="board"></div>
        <div class="row-label">6</div><div class="row-label">5</div><div class="row-label">4</div><div class="row-label">3</div><div class="row-label">2</div><div class="row-label">1</div>
        <div></div><div class="col-label">A</div><div class="col-label">B</div><div class="col-label">C</div><div class="col-label">D</div><div class="col-label">E</div><div class="col-label">F</div><div class="col-label">G</div>
      </div>
    </div>
    <div class="notation-panel">
      <strong><small>OPERASYON KAYDI</small></strong>
      <ul id="notationList"></ul>
    </div>
  </div>
  <div class="controls">
    <button class="btn btn-undo" onclick="undo()">GERİ AL</button>
    <button class="btn btn-reset" onclick="initGame()">RESET</button>
    <button class="btn btn-download" onclick="downloadNotation()">KAYDET</button>
    <button class="btn btn-exit" onclick="backToMain()">ÇIKIŞ</button>
  </div>
</div>

<script>
const size = 7;
const cols = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
let board = [], currentPlayer = "black", phase = "move", gameOver = false, history = [];
let players = { black: { x: 0, y: 3 }, white: { x: 6, y: 3 } };
let currentMoveNotation = "", isVsAI = false, userColor = "black", aiDifficulty = "hard", aiTimeout = null;

function showSetup(vsAI) {
  isVsAI = vsAI;
  document.getElementById("mainMenu").style.display = "none";
  document.getElementById("setupMenu").style.display = "block";
  document.getElementById("difficultySection").style.display = vsAI ? "block" : "none";
}

function backToMain() {
  clearTimeout(aiTimeout);
  document.getElementById("gameArea").style.display = "none";
  document.getElementById("setupMenu").style.display = "none";
  document.getElementById("mainMenu").style.display = "block";
}

function startGame() {
  userColor = document.getElementById("playerColor").value;
  aiDifficulty = document.getElementById("difficulty").value;
  document.getElementById("setupMenu").style.display = "none";
  document.getElementById("gameArea").style.display = "flex";
  initGame();
}

function initGame() {
  clearTimeout(aiTimeout);
  board = Array(size).fill().map(() => Array(size).fill("empty"));
  currentPlayer = "black"; phase = "move"; gameOver = false; history = [];
  players.black = { x: 0, y: 3 }; players.white = { x: 6, y: 3 };
  board[0][3] = "black"; board[6][3] = "white";
  document.getElementById("notationList").innerHTML = "";
  render(); updateStatus();
  if(isVsAI && currentPlayer !== userColor) aiTimeout = setTimeout(runAI, 600);
}

function render() {
  const boardDiv = document.getElementById("board");
  boardDiv.innerHTML = "";
  for (let i = 0; i < size; i++) {
    for (let j = 0; j < size; j++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      if (board[i][j] === "blocked") cell.classList.add("blocked");
      if (board[i][j] === "black" || board[i][j] === "white") {
        const p = document.createElement("div");
        p.className = `piece ${board[i][j]}`;
        if (!gameOver && board[i][j] === currentPlayer) p.classList.add("glow");
        cell.appendChild(p);
      } else if (!gameOver && phase === "move" && (currentPlayer === userColor || !isVsAI)) {
        const pCur = players[currentPlayer];
        if (Math.abs(pCur.x - i) <= 1 && Math.abs(pCur.y - j) <= 1 && board[i][j] === "empty") {
          cell.style.background = "#446644";
          cell.style.boxShadow = "inset 0 0 10px #2ecc71";
        }
      }
      cell.onclick = () => { if(!(isVsAI && currentPlayer !== userColor)) handleClick(i, j); };
      boardDiv.appendChild(cell);
    }
  }
}

function handleClick(x, y) {
  if (gameOver) return;
  if (phase === "move") movePiece(x, y);
  else blockCell(x, y);
}

function movePiece(x, y) {
  const p = players[currentPlayer];
  if (board[x][y] !== "empty" || Math.abs(p.x - x) > 1 || Math.abs(p.y - y) > 1) return;
  saveState();
  board[p.x][p.y] = "empty"; board[x][y] = currentPlayer;
  currentMoveNotation = `${currentPlayer === 'black' ? 'Siyah' : 'Beyaz'}: ${getCoord(p.x, p.y)}→${getCoord(x, y)}`;
  players[currentPlayer] = { x, y };
  updateNotationUI(currentMoveNotation, true);
  phase = "block"; render(); updateStatus();
  if(isVsAI && currentPlayer !== userColor) aiTimeout = setTimeout(runAI, 600);
}

function blockCell(x, y) {
  if (board[x][y] !== "empty") return;
  saveState();
  board[x][y] = "blocked";
  currentMoveNotation += ` | #${getCoord(x, y)}`;
  updateNotationUI(currentMoveNotation, false);
  render();
  if (checkWin()) { gameOver = true; return; }
  phase = "move"; currentPlayer = (currentPlayer === "black") ? "white" : "black";
  render(); updateStatus();
  if(isVsAI && currentPlayer !== userColor && !gameOver) aiTimeout = setTimeout(runAI, 600);
}

// --- GELİŞMİŞ YAPAY ZEKA (STRATEJİK) ---
function runAI() {
  if (gameOver) return;
  const p = players[currentPlayer];
  const op = players[userColor];

  if (phase === "move") {
    let moves = getValidMoves(p.x, p.y, board);
    if (aiDifficulty === "easy") {
        let m = moves[Math.floor(Math.random()*moves.length)];
        movePiece(m.x, m.y);
    } else {
        // En iyi kareyi seç (Alan Kontrolü + Mesafe)
        let bestMove = moves[0];
        let maxScore = -9999;

        moves.forEach(m => {
            let score = calculateTerritory(m.x, m.y, board); // Kendi hareket alanı
            let distToCenter = 3 - (Math.abs(3-m.x) + Math.abs(3-m.y)); // Merkeze yakınlık
            score += distToCenter * 2;
            
            if (aiDifficulty === "hard") {
                // Rakibi kısıtlama kontrolü
                let distToOp = 10 - (Math.abs(m.x - op.x) + Math.abs(m.y - op.y));
                score += distToOp * 3;
            }

            if (score > maxScore) { maxScore = score; bestMove = m; }
        });
        movePiece(bestMove.x, bestMove.y);
    }
  } else {
    // BLOKLAMA STRATEJİSİ
    let bestBlock;
    if (aiDifficulty === "easy") {
        let em = getEmptyCells(board);
        bestBlock = em[Math.floor(Math.random()*em.length)];
    } else {
        let opMoves = getValidMoves(op.x, op.y, board);
        if (opMoves.length > 0) {
            // Rakibin kaçabileceği kareleri öncelikli kapat
            bestBlock = opMoves[0];
            // Eğer "Hard" ise rakibi en dar alana hapsedecek bloğu seç
            if (aiDifficulty === "hard") {
                let minOpTerritory = 999;
                opMoves.forEach(ob => {
                    let tempBoard = board.map(row => [...row]);
                    tempBoard[ob.x][ob.y] = "blocked";
                    let t = calculateTerritory(op.x, op.y, tempBoard);
                    if (t < minOpTerritory) { minOpTerritory = t; bestBlock = ob; }
                });
            }
        } else {
            let em = getEmptyCells(board);
            bestBlock = em[0];
        }
    }
    blockCell(bestBlock.x, bestBlock.y);
  }
}

// Alan Hesabı (Flood Fill benzeri basit sayım)
function calculateTerritory(x, y, currentBoard) {
    let count = 0;
    for(let i=-2; i<=2; i++) {
        for(let j=-2; j<=2; j++) {
            let nx=x+i, ny=y+j;
            if(nx>=0 && nx<size && ny>=0 && ny<size && currentBoard[nx][ny] === "empty") count++;
        }
    }
    return count;
}

function getValidMoves(x, y, currentBoard) {
  let v = [];
  for(let dx=-1; dx<=1; dx++) {
    for(let dy=-1; dy<=1; dy++) {
        let nx=x+dx, ny=y+dy;
        if(nx>=0 && nx<size && ny>=0 && ny<size && currentBoard[nx][ny]==="empty" && !(dx===0 && dy===0)) v.push({x:nx, y:ny});
    }
  }
  return v;
}

function getEmptyCells(b) {
    let e = [];
    for(let i=0; i<size; i++) for(let j=0; j<size; j++) if(b[i][j]==="empty") e.push({x:i, y:j});
    return e;
}

// --- DİĞER FONKSİYONLAR ---
function undo() {
  const steps = isVsAI ? 2 : 1;
  if (history.length < steps || gameOver) return;
  clearTimeout(aiTimeout);
  for(let i=0; i<steps; i++) {
    const s = history.pop();
    const l = document.getElementById("notationList");
    if (l.firstChild) l.removeChild(l.firstChild);
    board=s.board; currentPlayer=s.currentPlayer; phase=s.phase; players=JSON.parse(JSON.stringify(s.players)); gameOver=s.gameOver; currentMoveNotation=s.currentMoveNotation;
  }
  if(isVsAI) { currentPlayer = userColor; phase = "move"; }
  render(); updateStatus();
}

function checkWin() {
  const op = (currentPlayer === "black") ? "white" : "black";
  if(getValidMoves(players[op].x, players[op].y, board).length === 0) {
    const st = document.getElementById("status");
    st.innerText = "ZAFER: " + (currentPlayer === "black" ? "Siyah" : "Beyaz");
    st.style.color = "#2ecc71";
    return true;
  }
  return false;
}

function updateStatus() {
  const st = document.getElementById("status");
  if (isVsAI && currentPlayer !== userColor && !gameOver) {
    st.innerText = "GENERAL DÜŞÜNÜYOR..."; st.style.color = "#e74c3c";
  } else {
    st.innerText = `${currentPlayer === "black" ? "SİYAH" : "BEYAZ"} HAMLESİ`;
    st.style.color = "#3498db";
  }
}

function saveState() { history.push(JSON.parse(JSON.stringify({ board, currentPlayer, phase, players, gameOver, currentMoveNotation }))); }
function getCoord(x, y) { return cols[y] + (size - x); }
function updateNotationUI(t, isNew) {
  const l = document.getElementById("notationList");
  if (isNew) { const li = document.createElement("li"); li.className="notation-item"; li.innerText=t; l.prepend(li); }
  else if (l.firstChild) l.firstChild.innerText = t;
}
function downloadNotation() {
  let txt = "ABLUKA OPERASYON KAYDI\n\n";
  Array.from(document.querySelectorAll(".notation-item")).reverse().forEach((it, idx) => { txt += `${idx + 1}. ${it.innerText}\n`; });
  const b = new Blob([txt], { type: "text/plain" });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a"); a.href = u; a.download = "abluka_log.txt"; a.click();
}
</script>
</body>
</html>
