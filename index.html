<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abluka 7x7 - Mobile</title>
    <style>
        :root {
            --bg-color: #1e272e;
            --cell-color: #485460;
            --p1-color: #ff5e57; /* Mercan Kırmızısı */
            --p2-color: #0fbcf9; /* Canlı Mavi */
            --wall-color: #ffd32a; /* Altın Sarısı */
            --empty-wall: #2f3542;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow: hidden; /* Kaydırmayı engellemek için */
            touch-action: manipulation;
        }

        .header { margin: 15px 0; text-align: center; }
        #status { font-weight: bold; font-size: 1.3rem; margin-bottom: 5px; }
        .stats { font-size: 0.9rem; opacity: 0.8; }

        /* 7x7 Izgara Tasarımı */
        /* 7 hücre + 6 duvar boşluğu */
        #board {
            display: grid;
            grid-template-columns: repeat(6, 45px 12px) 45px;
            grid-template-rows: repeat(6, 45px 12px) 45px;
            background-color: #000;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .cell {
            background-color: var(--cell-color);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* Duvarlar için daha geniş dokunma alanları */
        .wall-v { width: 12px; background-color: var(--empty-wall); cursor: pointer; border-radius: 3px; }
        .wall-h { height: 12px; background-color: var(--empty-wall); cursor: pointer; border-radius: 3px; }
        .wall-v.active, .wall-h.active { background-color: var(--wall-color); box-shadow: 0 0 10px var(--wall-color); }

        .pawn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.4);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .p1 { background-color: var(--p1-color); }
        .p2 { background-color: var(--p2-color); }

        .controls { margin-top: 25px; }
        button {
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 20px;
            border: none;
            background-color: #575fcf;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>ABLUKA 7x7</h2>
        <div id="status">Sıra: <span style="color:var(--p1-color)">Oyuncu 1</span></div>
        <div class="stats">
            P1 Engel: <span id="p1-walls">8</span> | 
            P2 Engel: <span id="p2-walls">8</span>
        </div>
    </div>

    <div id="board"></div>

    <div class="controls">
        <button onclick="location.reload()">Yeni Oyun</button>
    </div>

<script>
    const boardSize = 7;
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    
    // 7x7 için başlangıç pozisyonları (orta sütun: 3)
    let p1Pos = { r: 6, c: 3 }; 
    let p2Pos = { r: 0, c: 3 };
    let p1Walls = 8; // 7x7 için 8 engel idealdir
    let p2Walls = 8;
    let turn = 1;
    let walls = new Set();

    function initBoard() {
        boardEl.innerHTML = '';
        for (let r = 0; r < boardSize; r++) {
            for (let c = 0; c < boardSize; c++) {
                // Hücre oluştur
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (r === p1Pos.r && c === p1Pos.c) cell.innerHTML = '<div class="pawn p1"></div>';
                if (r === p2Pos.r && c === p2Pos.c) cell.innerHTML = '<div class="pawn p2"></div>';
                cell.onclick = () => movePawn(r, c);
                boardEl.appendChild(cell);

                // Dikey Duvarlar
                if (c < boardSize - 1) {
                    const wv = document.createElement('div');
                    wv.className = 'wall-v' + (walls.has(`${r}-${c}-v`) ? ' active' : '');
                    wv.onclick = () => placeWall(r, c, 'v');
                    boardEl.appendChild(wv);
                }
            }
            // Yatay Duvarlar
            if (r < boardSize - 1) {
                for (let c = 0; c < boardSize; c++) {
                    const wh = document.createElement('div');
                    wh.className = 'wall-h' + (walls.has(`${r}-${c}-h`) ? ' active' : '');
                    wh.onclick = () => placeWall(r, c, 'h');
                    boardEl.appendChild(wh);
                    if (c < boardSize - 1) boardEl.appendChild(document.createElement('div'));
                }
            }
        }
    }

    function movePawn(r, c) {
        const current = turn === 1 ? p1Pos : p2Pos;
        const other = turn === 1 ? p2Pos : p1Pos;
        const dist = Math.abs(current.r - r) + Math.abs(current.c - c);
        
        // Üst üste binme kontrolü
        if (r === other.r && c === other.c) return;

        // Geçerli hareket (komşu kare)
        if (dist === 1) {
            if (turn === 1) p1Pos = {r, c}; else p2Pos = {r, c};
            if (checkWin()) return;
            nextTurn();
        }
    }

    function placeWall(r, c, type) {
        const wallKey = `${r}-${c}-${type}`;
        const currentWalls = turn === 1 ? p1Walls : p2Walls;

        if (currentWalls > 0 && !walls.has(wallKey)) {
            walls.add(wallKey);
            if (turn === 1) p1Walls--; else p2Walls--;
            document.getElementById(`p${turn}-walls`).innerText = (turn === 1 ? p1Walls : p2Walls);
            nextTurn();
        }
    }

    function nextTurn() {
        turn = turn === 1 ? 2 : 1;
        const color = turn === 1 ? 'var(--p1-color)' : 'var(--p2-color)';
        statusEl.innerHTML = `Sıra: <span style="color:${color}">Oyuncu ${turn}</span>`;
        initBoard();
    }

    function checkWin() {
        if (p1Pos.r === 0) {
            statusEl.innerHTML = "<b style='color:var(--p1-color)'>OYUNCU 1 KAZANDI!</b>";
            disableClicks();
            return true;
        }
        if (p2Pos.r === 6) {
            statusEl.innerHTML = "<b style='color:var(--p2-color)'>OYUNCU 2 KAZANDI!</b>";
            disableClicks();
            return true;
        }
        return false;
    }

    function disableClicks() {
        boardEl.style.pointerEvents = 'none';
    }

    initBoard();
</script>
</body>
</html>
