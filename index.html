<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abluka Oyunu - Geliştirilmiş</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1a1a1a;
    color: white;
    text-align: center;
    margin: 0;
    padding: 20px;
  }

  h1 {
    margin-top: 10px;
    color: #f0f0f0;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }

  #status {
    margin: 15px;
    font-size: 20px;
    font-weight: bold;
    height: 30px;
    color: #ffd700;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(7, 60px);
    gap: 8px;
    justify-content: center;
    margin: 20px auto;
    perspective: 800px;
  }

  /* Mobil cihazlar için uyumluluk */
  @media (max-width: 500px) {
    #board {
      grid-template-columns: repeat(7, 12vw);
      gap: 5px;
    }
    .cell {
      width: 12vw !important;
      height: 12vw !important;
    }
    .piece {
      width: 9vw !important;
      height: 9vw !important;
    }
  }

  .cell {
    width: 60px;
    height: 60px;
    background: linear-gradient(145deg, #deb887, #c79a6b);
    border-radius: 10px;
    box-shadow: 3px 3px 6px rgba(0,0,0,0.4), inset 1px 1px 2px rgba(255,255,255,0.3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    position: relative;
  }

  .cell:hover {
    transform: scale(1.05);
    filter: brightness(1.1);
  }

  .blocked {
    background: #444 !important;
    box-shadow: inset 2px 2px 10px rgba(0,0,0,0.8);
    cursor: not-allowed;
  }
  
  /* Bloklanan kareye çarpı efekti */
  .blocked::after {
    content: "✕";
    color: #ff4444;
    font-size: 24px;
    opacity: 0.5;
  }

  .piece {
    width: 45px;
    height: 45px;
    border-radius: 50%; /* Daha dairesel ve şık görünüm */
    box-shadow: 2px 4px 6px rgba(0,0,0,0.5);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 2;
  }

  .black { background: radial-gradient(circle at 30% 30%, #444, #000); }
  .white { background: radial-gradient(circle at 30% 30%, #fff, #ccc); border: 1px solid #999; }

  .glow {
    box-shadow: 0 0 20px 5px rgba(255, 215, 0, 0.7);
    transform: scale(1.1);
  }

  .btn-reset {
    background: #e67e22;
    color: white;
    border: none;
    padding: 10px 25px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.3s;
  }

  .btn-reset:hover { background: #d35400; }

</style>
</head>
<body>

<h1>Abluka Oyunu</h1>
<div id="status">Yükleniyor...</div>
<div id="board"></div>
<button class="btn-reset" onclick="init()">Yeniden Başlat</button>

<script>
const size = 7;
let board = [];
let currentPlayer = "black";
let phase = "move"; // move -> block

let players = {
  black: { x: 0, y: 3 },
  white: { x: 6, y: 3 }
};

function init() {
  // Değişkenleri sıfırla
  board = Array(size).fill().map(() => Array(size).fill("empty"));
  currentPlayer = "black";
  phase = "move";
  players.black = { x: 0, y: 3 };
  players.white = { x: 6, y: 3 };
  
  // Tahtayı kur
  board[players.black.x][players.black.y] = "black";
  board[players.white.x][players.white.y] = "white";
  
  render();
  updateStatus();
}

function render() {
  const boardDiv = document.getElementById("board");
  boardDiv.innerHTML = "";

  for (let i = 0; i < size; i++) {
    for (let j = 0; j < size; j++) {
      const cell = document.createElement("div");
      cell.className = "cell";

      const pCurrent = players[currentPlayer];
      const isNearby = Math.abs(pCurrent.x - i) <= 1 && Math.abs(pCurrent.y - j) <= 1;

      // Bloklu hücre kontrolü
      if (board[i][j] === "blocked") {
        cell.classList.add("blocked");
      }

      // Oyuncu taşlarını çiz
      if (board[i][j] === "black" || board[i][j] === "white") {
        const p = document.createElement("div");
        p.className = `piece ${board[i][j]}`;
        // Sırası gelen oyuncunun taşını parlat
        if (board[i][j] === currentPlayer) p.classList.add("glow");
        cell.appendChild(p);
      } 
      // Gidilebilir kareleri vurgula (Hata düzeltildi!)
      else if (phase === "move" && isNearby && board[i][j] === "empty") {
        cell.style.boxShadow = "inset 0 0 15px gold";
        cell.style.background = "linear-gradient(145deg, #f1c40f, #c79a6b)";
      }

      cell.onclick = () => handleClick(i, j);
      boardDiv.appendChild(cell);
    }
  }
}

function handleClick(x, y) {
  if (phase === "move") movePiece(x, y);
  else blockCell(x, y);
}

function movePiece(x, y) {
  const p = players[currentPlayer];

  if (board[x][y] !== "empty") return;

  // Çevresindeki 8 kare kontrolü
  if (Math.abs(p.x - x) <= 1 && Math.abs(p.y - y) <= 1) {
    board[p.x][p.y] = "empty";
    board[x][y] = currentPlayer;
    players[currentPlayer] = { x, y };
    phase = "block";
    render();
    updateStatus();
  }
}

function blockCell(x, y) {
  if (board[x][y] !== "empty") return;

  board[x][y] = "blocked";
  
  if (checkWin()) return;

  phase = "move";
  currentPlayer = (currentPlayer === "black") ? "white" : "black";
  render();
  updateStatus();
}

function checkWin() {
  const opponent = (currentPlayer === "black") ? "white" : "black";
  const p = players[opponent];

  let canMove = false;

  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      if (dx === 0 && dy === 0) continue;

      let nx = p.x + dx;
      let ny = p.y + dy;

      if (
        nx >= 0 && ny >= 0 &&
        nx < size && ny < size &&
        board[nx][ny] === "empty"
      ) {
        canMove = true;
      }
    }
  }

  if (!canMove) {
    document.getElementById("status").innerText = 
      "OYUN BİTTİ! " + (currentPlayer === "black" ? "Siyah" : "Beyaz") + " kazandı!";
    document.getElementById("status").style.color = "#2ecc71";
    // Tıklamaları durdurmak için board render'ı etkisiz bırakılabilir
    return true;
  }

  return false;
}

function updateStatus() {
  const turnText = (currentPlayer === "black" ? "Siyah" : "Beyaz");
  const actionText = (phase === "move" ? "Taşını Oynat" : "Blok Koy!");
  document.getElementById("status").innerText = `${turnText} Oyuncusu - ${actionText}`;
}

// Oyunu başlat
init();
</script>

</body>
</html>
