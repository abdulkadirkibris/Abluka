<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Küre Oyunu - 7x7 Edition</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #2b2b2b; color: white; text-align: center; margin: 0; padding: 10px;
  }

  .header-container {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin: 10px 0 15px 0;
  }

  h1 { margin: 0; font-size: 32px; color: #ffd700; font-weight: bold; }

  .game-container {
    display: flex; flex-direction: row; justify-content: center;
    align-items: flex-start; gap: 20px; flex-wrap: wrap;
  }

  .board-outer {
    background: #3d3d3d; padding: 10px; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 550px;
  }

  #board {
    display: grid; 
    grid-template-columns: repeat(7, 1fr); /* 7 Sütun */
    gap: 6px;
    background: #1a1a1a; padding: 10px; border-radius: 8px;
  }

  .cell {
    aspect-ratio: 1 / 1; background: #444; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: 0.2s; border: 2px solid transparent;
  }

  .cell:hover { background: #555; }

  .sphere {
    width: 85%; height: 85%; border-radius: 50%;
    box-shadow: inset -4px -4px 10px rgba(0,0,0,0.5), 2px 4px 8px rgba(0,0,0,0.3);
  }

  /* Yeni Renkler: Mor ve Turuncu */
  .purple { background: radial-gradient(circle at 30% 30%, #a18cd1, #800080); }
  .orange { background: radial-gradient(circle at 30% 30%, #ff9a9e, #f6d365); }
  
  .selected { border: 3px solid #ffd700; transform: scale(1.1); z-index: 2; }
  .valid-move { background: rgba(255, 215, 0, 0.15) !important; border: 1px dashed #ffd700; }

  #status { margin-bottom: 15px; color: #ffd700; font-size: 1.2em; height: 30px; font-weight: bold; }

  .rules-panel {
    width: 250px; background: #1a1a1a; border-radius: 10px;
    padding: 15px; text-align: left; border: 1px solid #444; font-size: 14px;
  }

  .rules-panel h3 { color: #ffd700; margin-top: 0; }
  .rules-panel ul { padding-left: 18px; color: #ccc; line-height: 1.6; }

  .btn {
    border: none; padding: 12px 25px; border-radius: 5px;
    cursor: pointer; font-weight: bold; background: #e67e22; color: white; transition: 0.2s;
  }
  .btn:hover { background: #d35400; }

  @media (max-width: 600px) {
    .game-container { flex-direction: column; align-items: center; }
    .rules-panel { width: 100%; max-width: 550px; }
  }
</style>
</head>
<body>

<div class="header-container">
  <h1>Küre Oyunu (7x7)</h1>
</div>

<div id="status">Mor Oyuncu Başlar</div>

<div class="game-container">
  <div class="board-outer">
    <div id="board"></div>
  </div>

  <div class="rules-panel">
    <h3>Nasıl Oynanır?</h3>
    <ul>
      <li><b>Mor:</b> Yukarıdan aşağıya ilerler.</li>
      <li><b>Turuncu:</b> Aşağıdan yukarıya ilerler.</li>
      <li>Hamle: 1 kare ileri veya çapraz-ileri.</li>
      <li><b>Kazanma:</b> Herhangi bir küreni rakibin en dipteki başlangıç satırına ulaştır!</li>
    </ul>
    <button class="btn" style="width:100%; margin-top:10px;" onclick="init()">Yeniden Başlat</button>
    <a href="index.html" class="btn" style="width:100%; margin-top:10px; display:block; text-align:center; text-decoration:none; background:#3498db;">Ana Sayfaya Dön</a>
  </div>
</div>

<script>
const size = 7; // Tahta boyutu 7x7
let board = [];
let currentPlayer = "purple"; 
let selectedCell = null;
let gameOver = false;

function init() {
  board = Array(size).fill(null).map(() => Array(size).fill(null));
  
  // Mor küreler en üst sıraya (0)
  for(let j=0; j<size; j++) board[0][j] = "purple";
  
  // Turuncu küreler en alt sıraya (6)
  for(let j=0; j<size; j++) board[size-1][j] = "orange";
  
  currentPlayer = "purple";
  selectedCell = null;
  gameOver = false;
  document.getElementById("status").innerText = "Mor Oyuncu Başlar";
  document.getElementById("status").style.color = "#a18cd1";
  render();
}

function render() {
  const boardDiv = document.getElementById("board");
  boardDiv.innerHTML = "";

  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      
      if (board[r][c]) {
        const sphere = document.createElement("div");
        sphere.className = `sphere ${board[r][c]}`;
        cell.appendChild(sphere);
      }

      if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
        cell.classList.add("selected");
      }

      if (selectedCell && isValidMove(selectedCell.r, selectedCell.c, r, c)) {
        cell.classList.add("valid-move");
      }

      cell.onclick = () => handleClick(r, c);
      boardDiv.appendChild(cell);
    }
  }
}

function handleClick(r, c) {
  if (gameOver) return;

  if (board[r][c] === currentPlayer) {
    selectedCell = {r, c};
  } else if (selectedCell) {
    if (isValidMove(selectedCell.r, selectedCell.c, r, c)) {
      moveSphere(selectedCell.r, selectedCell.c, r, c);
      return;
    }
    selectedCell = null;
  }
  render();
}

function isValidMove(fromR, fromC, toR, toC) {
  if (board[toR][toC] !== null) return false;

  const rowDiff = toR - fromR;
  const colDiff = Math.abs(toC - fromC);

  // Mor aşağı (row+), Turuncu yukarı (row-)
  const direction = (currentPlayer === "purple") ? 1 : -1;

  // 1 kare ileri veya 1 kare çapraz-ileri (colDiff 0 veya 1)
  return rowDiff === direction && colDiff <= 1;
}

function moveSphere(fromR, fromC, toR, toC) {
  board[toR][toC] = currentPlayer;
  board[fromR][fromC] = null;
  
  // Hedef satıra ulaştı mı?
  if ((currentPlayer === "purple" && toR === size - 1) || 
      (currentPlayer === "orange" && toR === 0)) {
    const winnerName = (currentPlayer === "purple" ? "Mor" : "Turuncu");
    document.getElementById("status").innerText = `OYUN BİTTİ: ${winnerName} KAZANDI!`;
    document.getElementById("status").style.color = "#2ecc71";
    gameOver = true;
    render();
    return;
  }

  currentPlayer = (currentPlayer === "purple") ? "orange" : "purple";
  selectedCell = null;
  updateStatus();
  render();
}

function updateStatus() {
  const status = document.getElementById("status");
  status.innerText = `${currentPlayer === "purple" ? "Mor" : "Turuncu"} Oyuncunun Sırası`;
  status.style.color = (currentPlayer === "purple") ? "#a18cd1" : "#f6d365";
}

init();
</script>
</body>
</html>
